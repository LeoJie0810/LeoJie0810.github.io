<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>毛概刷题 · 2023版《概论》</title>
<style>
:root{
  --bg:#f7f5f1;
  --bg2:#efebe4;
  --card:#ffffff;
  --ink:#1d1d1f;
  --sub:#706f6b;
  --line:#e6e1d9;
  --accent:#a52a20;
  --accent-soft:#fbeae7;
  --ok:#1f7a4d;
  --ok-soft:#e8f4ee;
  --err:#c0392b;
  --err-soft:#fceceb;
  --shadow:0 2px 8px rgba(60,45,30,.05), 0 12px 32px rgba(60,45,30,.06);
}
[data-theme="dark"]{
  --bg:#15161a;
  --bg2:#1a1c21;
  --card:#1f2127;
  --ink:#ececec;
  --sub:#9c9c9c;
  --line:#2e3138;
  --accent:#e0715f;
  --accent-soft:#33211f;
  --ok:#6fca9a;
  --ok-soft:#1d2f27;
  --err:#f08a80;
  --err-soft:#33201f;
  --shadow:0 2px 8px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding:28px 20px 60px;
  transition:background .25s,color .25s;
}
.wrap{max-width:880px;margin:0 auto}

header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}
.titleblock h1{margin:0 0 6px;font-size:26px;letter-spacing:.5px;font-weight:700}
.titleblock p{margin:0;color:var(--sub);font-size:13px;letter-spacing:.3px}
.themebtn{
  flex:none;border:1px solid var(--line);background:var(--card);color:var(--sub);
  padding:8px 12px;border-radius:9px;font-size:12.5px;cursor:pointer;transition:.18s;
}
.themebtn:hover{color:var(--ink);border-color:var(--accent)}
.head-actions{display:flex;gap:8px;align-items:center;flex:none}
.acc-on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(20,18,16,.5);display:none;align-items:center;justify-content:center;z-index:99;padding:20px}
.modal.show{display:flex}
.modal-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:370px;box-shadow:var(--shadow)}
.modal-card h3{margin:0 0 6px;font-size:17px;letter-spacing:.3px}
.modal-card .msub{margin:0 0 16px;font-size:12.5px;color:var(--sub);line-height:1.6}
.modal-card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font-size:13.5px;font-family:inherit;background:var(--bg);color:var(--ink);outline:none;margin-bottom:10px}
.modal-card input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:6px}
.modal-actions button{flex:1;padding:10px;border-radius:9px;font-size:13.5px;cursor:pointer;font-family:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);transition:.15s}
.modal-actions .primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.modal-actions button:disabled{opacity:.6;cursor:not-allowed}
.modal-msg{font-size:12.5px;margin-top:12px;min-height:16px;line-height:1.5;color:var(--err)}
.modal-msg.ok{color:var(--ok)}
.switch-line{margin-top:12px;font-size:12.5px;color:var(--sub);text-align:center}
.switch-line a{color:var(--accent);cursor:pointer;text-decoration:none}
.acc-info{margin:2px 0 14px;font-size:13px;line-height:1.7;color:var(--ink)}
.acc-info span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.sync-state{font-size:11.5px;color:var(--sub);text-align:center;margin-top:10px}

.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px;box-shadow:var(--shadow)}
.tab{
  border:0;background:transparent;color:var(--sub);padding:9px 22px;border-radius:9px;
  font-size:14px;cursor:pointer;transition:.18s;font-family:inherit;
}
.tab.active{background:var(--accent);color:#fff;font-weight:600}

.panel{display:none}
.panel.active{display:block}

.toolbar{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:var(--shadow);
}
.toolbar label{font-size:13px;color:var(--sub);margin-right:-4px}
.flabel{font-size:13px;color:var(--sub);margin-right:-4px}
.chk-group{display:flex;gap:6px;align-items:center}
.chk{display:inline-flex;align-items:center;gap:4px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:13px;color:var(--sub);background:var(--card);transition:.15s;user-select:none}
.chk input{display:none}
.chk i{font-style:normal}
.chk.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft);font-weight:600}
.typehint{font-size:12px;color:var(--err)}
.kh-tip{margin-left:auto;font-size:12.5px;color:var(--sub)}
.kh-tip b{color:var(--accent);font-weight:700}
select{
  font-family:inherit;font-size:13.5px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:9px;padding:8px 10px;cursor:pointer;outline:none;max-width:230px;
}
select:focus{border-color:var(--accent)}
.startbtn{
  margin-left:auto;background:var(--accent);color:#fff;border:0;border-radius:9px;
  padding:9px 20px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:.18s;
}
.startbtn:hover{filter:brightness(.94)}
.startbtn:disabled{opacity:.45;cursor:not-allowed}

.stats{display:flex;gap:0;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden;box-shadow:var(--shadow)}
.stat{flex:1;padding:12px 14px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:19px;font-weight:700;letter-spacing:.4px}
.stat span{font-size:11.5px;color:var(--sub);letter-spacing:.5px}
.stat.warn b{color:var(--accent)}

.progress{height:4px;background:var(--line);border-radius:4px;margin:16px 2px 0;overflow:hidden}
.progress > i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;transition:width .3s}

.qcard{
  background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:18px;
  padding:26px 26px 22px;box-shadow:var(--shadow);animation:fade .22s ease;
}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.badge{font-size:11.5px;padding:4px 9px;border-radius:6px;letter-spacing:.3px}
.badge.type{background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.ch{background:transparent;color:var(--sub);border:1px solid var(--line)}
.badge.idx{color:var(--sub);margin-left:auto;font-variant-numeric:tabular-nums}

.stem{font-size:17.5px;line-height:1.85;letter-spacing:.2px;margin-bottom:20px;white-space:pre-wrap}
.stem .hint{display:block;font-size:12.5px;color:var(--sub);margin-top:8px;letter-spacing:.4px}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  background:transparent;border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;font-size:15px;line-height:1.65;color:var(--ink);
  cursor:pointer;transition:.16s;font-family:inherit;
}
.opt:hover:not(.locked){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{
  flex:none;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--sub);
}
.opt .t{flex:1;padding-top:1px}
.opt.selected{border-color:var(--accent);background:var(--accent-soft)}
.opt.selected .k{border-color:var(--accent);background:var(--accent);color:#fff}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .k{border-color:var(--ok);background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--err);background:var(--err-soft)}
.opt.wrong .k{border-color:var(--err);background:var(--err);color:#fff}
.opt.locked{cursor:default}

.actions{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap}
.qnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.qnav .btn{padding:7px 14px;font-size:13px}
.qnav .btn:disabled{opacity:.4;cursor:not-allowed}
.navpos{font-size:12.5px;color:var(--sub);letter-spacing:.3px}
.resume-tip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink);margin-bottom:14px;line-height:1.6}
.resume-tip .btn{margin-left:auto;padding:6px 12px;font-size:12.5px}
.spacer{flex:1}
.btn{
  font-family:inherit;font-size:14px;padding:10px 22px;border-radius:10px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--sub);transition:.16s;
}
.btn:hover{color:var(--ink);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(.94);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.kbdhint{font-size:11.5px;color:var(--sub);letter-spacing:.3px}

.feedback{display:none;margin-top:20px;border-radius:12px;padding:15px 17px;font-size:14px;line-height:1.75;animation:fade .2s ease}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.feedback.err{background:var(--err-soft);border:1px solid var(--err)}
.feedback .fb-title{font-weight:700;margin-bottom:6px;letter-spacing:.3px}
.feedback.ok .fb-title{color:var(--ok)}
.feedback.err .fb-title{color:var(--err)}
.feedback .fb-body{color:var(--ink);white-space:pre-wrap}
.feedback .fb-ans{color:var(--sub);margin-top:6px;font-size:13.5px}
.feedback .fb-ans b{color:var(--accent)}
.fb-analysis{margin-top:12px;padding:11px 13px;border-radius:9px;background:rgba(255,255,255,.5);border-left:3px solid var(--accent);font-size:13.5px;line-height:1.85;color:var(--ink)}
.feedback.err .fb-analysis{border-left-color:var(--err)}
.fb-lab{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--accent);margin-right:6px;vertical-align:1px}
.feedback.err .fb-lab{color:var(--err)}

.done{
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:40px 26px;
  text-align:center;box-shadow:var(--shadow);margin-top:18px;
}
.done h2{margin:0 0 10px;font-size:22px}
.done p{color:var(--sub);font-size:14px;margin:6px 0}
.done .score{font-size:40px;font-weight:700;color:var(--accent);letter-spacing:1px;margin:14px 0 4px}

.empty{color:var(--sub);text-align:center;padding:50px 0;font-size:14px}

.kh-list{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.kh-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow)}
.kh-card h3{margin:0 0 16px;font-size:16px;color:var(--accent);letter-spacing:.3px;line-height:1.5}
.kh-sec + .kh-sec{margin-top:22px;padding-top:18px;border-top:1px dashed var(--line)}
.sec-tag{display:inline-block;font-size:11.5px;padding:4px 10px;border-radius:6px;margin-bottom:12px;letter-spacing:.4px;font-weight:600}
.sec-tag.obj{background:var(--accent-soft);color:var(--accent)}
.sec-tag.subj{background:var(--ok-soft);color:var(--ok)}
.kh-item{margin-bottom:14px}
.kh-item:last-child{margin-bottom:0}
.kh-item b{display:block;font-size:14.5px;line-height:1.6;margin-bottom:4px}
.kh-item p{margin:0;font-size:13.8px;line-height:1.85;color:var(--sub)}
.subj-item{border-left:3px solid var(--line);padding-left:14px;margin-bottom:18px}
.subj-item:last-child{margin-bottom:0}
.subj-q{font-size:14.5px;font-weight:600;line-height:1.6;margin-bottom:8px}
.subj-q .pg{font-size:11.5px;font-weight:400;color:var(--sub);margin-left:8px}
.subj-item ol{margin:0;padding-left:20px;list-style:decimal}
.subj-item li{font-size:13.5px;line-height:1.85;color:var(--sub);margin-bottom:3px}

footer{text-align:center;color:var(--sub);font-size:12px;margin-top:34px;letter-spacing:.3px;line-height:1.8}
footer a{color:var(--sub)}

@media (max-width:620px){
  body{padding:18px 13px 44px}
  .qcard{padding:20px 17px 18px;border-radius:14px}
  .stem{font-size:16px}
  .opt{font-size:14.5px;padding:12px 13px}
  .tab{padding:8px 16px}
  .startbtn{width:100%;margin-left:0}
  .titleblock h1{font-size:21px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titleblock">
      <h1>毛概刷题</h1>
      <p>2023 版《概论》知识点与练习题 · 共 <span id="totalCount">—</span> 题</p>
    </div>
    <div class="head-actions">
      <button class="themebtn" id="accBtn">登录同步</button>
      <button class="themebtn" id="themeBtn">夜间模式</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-panel="practice">刷题</button>
    <button class="tab" data-panel="knowledge">知识点</button>
  </div>

  <section class="panel active" id="panel-practice">
    <div class="toolbar">
      <label for="chSel">章节</label>
      <select id="chSel"></select>
      <span class="flabel">题型</span>
      <div class="chk-group" id="typeChk">
        <label class="chk"><input type="checkbox" value="single" checked><i>单选</i></label>
        <label class="chk"><input type="checkbox" value="multiple" checked><i>多选</i></label>
        <label class="chk"><input type="checkbox" value="short" checked><i>简答</i></label>
      </div>
      <span class="typehint" id="typeHint"></span>
      <label for="orderSel">顺序</label>
      <select id="orderSel">
        <option value="random">随机</option>
        <option value="seq">按章节顺序</option>
      </select>
      <button class="startbtn" id="startBtn">开始刷题</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="stProgress">0/0</b><span>进度</span></div>
      <div class="stat"><b id="stAnswered">0</b><span>已答</span></div>
      <div class="stat"><b id="stCorrect">0</b><span>答对</span></div>
      <div class="stat"><b id="stRate">—</b><span>正确率</span></div>
      <div class="stat warn"><b id="stWrong">0</b><span>错题本</span></div>
    </div>
    <div class="progress"><i id="bar"></i></div>

    <div id="qArea"></div>
  </section>

  <section class="panel" id="panel-knowledge">
    <div class="toolbar kh-toolbar">
      <label for="khTypeSel">题型分类</label>
      <select id="khTypeSel">
        <option value="all">全部考点</option>
        <option value="objective">客观题考点（选择）</option>
        <option value="subjective">主观题考点（简答/论述）</option>
      </select>
      <span class="kh-tip">共 <b id="khCount">—</b> 条考点</span>
    </div>
    <div class="kh-list" id="khList"></div>
  </section>

  <footer>
    题库来源：2023 版《概论》各章知识点及练习题<br>
    <a href="/">← 返回博客首页</a>
  </footer>
</div>

<div class="modal" id="accModal">
  <div class="modal-card">
    <h3 id="accTitle">登录以同步进度</h3>
    <p class="msub" id="accSub">登录后，手机和电脑共用同一份答题进度与错题本</p>
    <div id="accForm">
      <input type="email" id="accEmail" placeholder="邮箱" autocomplete="username">
      <input type="password" id="accPwd" placeholder="密码（至少 6 位）" autocomplete="current-password">
      <div class="modal-actions">
        <button id="accClose">取消</button>
        <button class="primary" id="accSubmit">登录</button>
      </div>
      <div class="switch-line" id="accSwitch">没有账号？<a id="accToggle">注册一个</a></div>
    </div>
    <div id="accProfile" style="display:none">
      <div class="acc-info"><b id="accMail">—</b><span id="accSync">已同步</span></div>
      <div class="modal-actions">
        <button id="accClose2">关闭</button>
        <button id="accLogout">退出登录</button>
      </div>
    </div>
    <div class="modal-msg" id="accMsg"></div>
    <div class="sync-state" id="accHint">未登录时进度只保存在本机浏览器</div>
  </div>
</div>

<script src="supabase.min.js"></script>
<script>
(function(){
  "use strict";

  var DATA = null;
  var CHAPTERS = [];
  var QTYPE_LABEL = {single:"单选题", multiple:"多选题", short:"简答题"};

  var LS_WRONG = "mg_wrong_v1";
  var LS_THEME = "mg_theme_v1";
  var LS_SESSION = "mg_session_v1";

  var wrongSet = new Set();
  try {
    var saved = JSON.parse(localStorage.getItem(LS_WRONG) || "[]");
    if (Array.isArray(saved)) saved.forEach(function(id){ wrongSet.add(id); });
  } catch(e){}

  var state = {
    queue: [],
    idx: 0,
    answered: 0,
    correct: 0,
    selected: [],
    locked: false,
    revealed: false,
    log: {},
    resumed: false
  };

  var el = {
    chSel: document.getElementById("chSel"),
    typeChk: document.getElementById("typeChk"),
    orderSel: document.getElementById("orderSel"),
    startBtn: document.getElementById("startBtn"),
    qArea: document.getElementById("qArea"),
    khList: document.getElementById("khList"),
    khTypeSel: document.getElementById("khTypeSel"),
    khCount: document.getElementById("khCount"),
    stProgress: document.getElementById("stProgress"),
    stAnswered: document.getElementById("stAnswered"),
    stCorrect: document.getElementById("stCorrect"),
    stRate: document.getElementById("stRate"),
    stWrong: document.getElementById("stWrong"),
    bar: document.getElementById("bar"),
    totalCount: document.getElementById("totalCount"),
    themeBtn: document.getElementById("themeBtn")
  };

  /* ================= 云端同步（Supabase） ================= */
  var SB_URL = "https://cegvxzdfzgdybrcxdvcp.supabase.co";
  var SB_KEY = "sb_publishable_zjmcaxE9kvZcGJNPg3aQFA_NVryt9TB";
  var SB_TABLE = "quiz_progress";

  var sb = null;
  var sbUser = null;
  var syncTimer = null;
  var syncBusy = false;
  var authMode = "signin";

  function initSupabase(){
    if (typeof window.supabase === "undefined" || !window.supabase.createClient) return null;
    try {
      return window.supabase.createClient(SB_URL, SB_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
      });
    } catch(e){ return null; }
  }

  function uiMsg(text, ok){
    var m = document.getElementById("accMsg");
    if (!m) return;
    m.textContent = text || "";
    m.className = "modal-msg" + (ok ? " ok" : "");
  }

  function setSyncText(t){
    var s = document.getElementById("accSync");
    if (s) s.textContent = t;
    var h = document.getElementById("accHint");
    if (h) h.textContent = sbUser ? "云端已保存，换设备登录即可接着答" : "未登录时进度只保存在本机浏览器";
  }

  function refreshAccBtn(){
    var b = document.getElementById("accBtn");
    if (!b) return;
    if (sbUser){
      b.textContent = (sbUser.email || "已登录").split("@")[0] + " · 已同步";
      b.classList.add("acc-on");
    } else {
      b.textContent = "登录同步";
      b.classList.remove("acc-on");
    }
  }

  function collectLocal(){
    var s = null;
    try { s = JSON.parse(localStorage.getItem(LS_SESSION) || "null"); } catch(e){}
    return { v: 2, wrong: Array.from(wrongSet), session: s, ts: Date.now() };
  }

  function saveWrongLocal(){
    try { localStorage.setItem(LS_WRONG, JSON.stringify(Array.from(wrongSet))); } catch(e){}
  }

  function pushNow(){
    if (!sb || !sbUser || syncBusy) return;
    syncBusy = true;
    var payload = collectLocal();
    sb.from(SB_TABLE).upsert(
      { user_id: sbUser.id, data: payload, updated_at: new Date().toISOString() },
      { onConflict: "user_id" }
    ).then(function(res){
      syncBusy = false;
      setSyncText(res && res.error ? "同步失败，稍后重试" : "已同步");
    }).catch(function(){
      syncBusy = false;
      setSyncText("同步失败，稍后重试");
    });
  }

  function schedulePush(){
    if (!sb || !sbUser) return;
    setSyncText("同步中…");
    if (syncTimer) return;
    syncTimer = setTimeout(function(){ syncTimer = null; pushNow(); }, 1000);
  }

  function resetAndRestore(){
    state.queue = []; state.idx = 0; state.answered = 0; state.correct = 0;
    state.log = {}; state.selected = []; state.locked = false; state.revealed = false;
    state.resumed = true;
    restoreSession();
  }

  function applyCloud(cloud){
    if (!cloud){ pushNow(); return; }
    var changed = false;
    var cw = Array.isArray(cloud.wrong) ? cloud.wrong : [];
    cw.forEach(function(id){ if (!wrongSet.has(id)){ wrongSet.add(id); changed = true; } });
    if (changed) saveWrongLocal();

    var localS = null, cloudS = cloud.session || null;
    try { localS = JSON.parse(localStorage.getItem(LS_SESSION) || "null"); } catch(e){}
    var pick = null;
    if (!localS) pick = cloudS;
    else if (!cloudS) pick = localS;
    else {
      var la = parseInt(localS.answered, 10) || 0, ca = parseInt(cloudS.answered, 10) || 0;
      if (ca > la) pick = cloudS;
      else if (ca === la && (parseInt(cloudS.idx, 10) || 0) > (parseInt(localS.idx, 10) || 0)) pick = cloudS;
      else pick = localS;
    }
    if (pick && pick !== localS){
      try { localStorage.setItem(LS_SESSION, JSON.stringify(pick)); } catch(e){}
      resetAndRestore();
    }
    if (typeof updateStats === "function") updateStats();
    schedulePush();
  }

  function fetchCloud(cb){
    if (!sb || !sbUser){ cb(null); return; }
    sb.from(SB_TABLE).select("data").eq("user_id", sbUser.id).maybeSingle()
      .then(function(res){
        if (res && res.error){ uiMsg("读取云端进度失败：" + res.error.message); cb(null); return; }
        cb(res && res.data ? res.data.data : null);
      }).catch(function(){ cb(null); });
  }

  function errText(msg){
    var m = msg || "";
    if (/Invalid login credentials/i.test(m)) return "邮箱或密码不正确";
    if (/already registered/i.test(m)) return "该邮箱已注册，请直接登录";
    if (/at least 6 characters/i.test(m)) return "密码至少需要 6 位";
    if (/Email not confirmed/i.test(m)) return "邮箱还没验证：到 Supabase 关闭 Confirm email 后再试";
    if (/Invalid email/i.test(m)) return "邮箱格式不对";
    if (/rate limit/i.test(m)) return "尝试太频繁，等几分钟再试";
    return m;
  }

  function showForm(){
    var f = document.getElementById("accForm"), p = document.getElementById("accProfile");
    if (f) f.style.display = "block";
    if (p) p.style.display = "none";

  function showProfile(){
    var f = document.getElementById("accForm"), p = document.getElementById("accProfile");
    if (f) f.style.display = "none";
    if (p) p.style.display = "block";

  function afterLogin(user){
    sbUser = user;
    refreshAccBtn();
    showProfile();
    fetchCloud(function(cloud){ applyCloud(cloud); });
  }

  function doAuth(){
    if (!sb){ uiMsg("同步服务没加载上，刷新页面再试"); return; }
    var email = (document.getElementById("accEmail").value || "").trim();
    var pwd = document.getElementById("accPwd").value || "";
    if (!email || !pwd){ uiMsg("邮箱和密码都要填"); return; }
    var btn = document.getElementById("accSubmit");
    btn.disabled = true;
    uiMsg(authMode === "signup" ? "正在注册…" : "正在登录…", true);
    var req = authMode === "signup"
      ? sb.auth.signUp({ email: email, password: pwd })
      : sb.auth.signInWithPassword({ email: email, password: pwd });
    req.then(function(res){
      btn.disabled = false;
      if (res && res.error){ uiMsg(errText(res.error.message)); return; }
      var user = res && res.data && (res.data.user || (res.data.session && res.data.session.user));
      if (authMode === "signup" && !(res.data && res.data.session)){
        uiMsg("注册成功，但邮箱验证还开着：请到 Supabase 关闭 Confirm email 后再登录", true);
        authMode = "signin";
        syncAuthLabels();
        return;
      }
      uiMsg("");
      if (user) afterLogin(user);
    }).catch(function(e){
      btn.disabled = false;
      uiMsg("网络异常：" + (e && e.message ? e.message : "请重试"));
    });
  }

  function syncAuthLabels(){
    var t = document.getElementById("accTitle");
    var s = document.getElementById("accSub");
    var b = document.getElementById("accSubmit");
    var sw = document.getElementById("accSwitch");
    if (authMode === "signup"){
      if (t) t.textContent = "注册账号";
      if (s) s.textContent = "注册后答题进度会存到云端，换设备登录即可继续";
      if (b) b.textContent = "注册";
    } else {
      if (t) t.textContent = "登录以同步进度";
      if (s) s.textContent = "登录后，手机和电脑共用同一份答题进度与错题本";
      if (b) b.textContent = "登录";
    }
    if (sw) sw.innerHTML = authMode === "signup"
      ? '已有账号？<a id="accToggle">直接登录</a>'
      : '没有账号？<a id="accToggle">注册一个</a>';
    var tg = document.getElementById("accToggle");
    if (tg) tg.addEventListener("click", function(){

  sb = initSupabase();
  if (sb){

      if (s && s.user){

    sb.auth.onAuthStateChange(function(evt, session){

  }

  /* ---------- 主题 ---------- */

    document.documentElement.setAttribute("data-theme", t);
    el.themeBtn.textContent = t === "dark" ? "日间模式" : "夜间模式";
    try { localStorage.setItem(LS_THEME, t); } catch(e){}
  }

  if (!savedTheme) savedTheme = "light";

  /* ---------- 工具 ---------- */
  function allQuestions(){
    var out = [];
    CHAPTERS.forEach(function(ch){
      ch.questions.forEach(function(q){ out.push(q); });
    });
    return out;
  }

  function findChapter(id){
    for (var i=0;i<CHAPTERS.length;i++) if (CHAPTERS[i].id === id) return CHAPTERS[i];
    return null;
  }

  function saveWrong(){
    try { localStorage.setItem(LS_WRONG, JSON.stringify(Array.from(wrongSet))); } catch(e){}
    if (typeof schedulePush === "function") schedulePush();
  }

  function normalize(a){
    return a.split("").sort().join("");
  }

  /* ---------- 进度持久化 ---------- */
  var saveTimer = null;

  function saveSession(immediate){
    var write = function(){
      try {
        localStorage.setItem(LS_SESSION, JSON.stringify({
          v: 1,
          queue: state.queue.map(function(q){ return q.id; }),
          idx: state.idx,
          answered: state.answered,
          correct: state.correct,
          log: state.log,
          done: !!(state.queue.length && state.idx >= state.queue.length)
        }));
      } catch(e){}
      if (typeof schedulePush === "function") schedulePush();
    };
    if (immediate){ if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; } write(); return; }
    if (saveTimer) return;
    saveTimer = setTimeout(function(){ saveTimer = null; write(); }, 200);
  }

  function clearSession(){
    try { localStorage.removeItem(LS_SESSION); } catch(e){}
  }

  function restoreSession(){
    var raw = null;
    try { raw = localStorage.getItem(LS_SESSION); } catch(e){}
    if (!raw) return false;

    var s = null;
    try { s = JSON.parse(raw); } catch(e){ return false; }
    if (!s || !Array.isArray(s.queue) || !s.queue.length || s.done) return false;

    var map = {};
    allQuestions().forEach(function(q){ map[q.id] = q; });
    var queue = [];
    for (var i = 0; i < s.queue.length; i++){
      var q = map[s.queue[i]];
      if (!q) return false;
      queue.push(q);
    }

    state.queue = queue;
    state.idx = Math.min(Math.max(0, parseInt(s.idx, 10) || 0), queue.length - 1);
    state.answered = parseInt(s.answered, 10) || 0;
    state.correct = parseInt(s.correct, 10) || 0;
    state.log = (s.log && typeof s.log === "object") ? s.log : {};
    state.resumed = true;

    renderQuestion();
    updateStats();
    return true;
  }

  /* ---------- 数据加载 ---------- */
  function loadData(){
    fetch("./quiz_data.json", {cache: "no-cache"})
      .then(function(r){
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function(d){ init(d); })
      .catch(function(err){
        el.qArea.innerHTML = '<div class="empty">题库加载失败：' + err.message + '<br>请刷新页面重试</div>';
      });
  }

  function init(d){
    DATA = d;
    CHAPTERS = d.chapters || [];
    el.totalCount.textContent = d.total || allQuestions().length;

    var opts = '<option value="all">全部章节</option>';
    CHAPTERS.forEach(function(ch){
      opts += '<option value="' + ch.id + '">' + ch.name + '</option>';
    });
    opts += '<option value="__wrong__">只刷错题本（' + wrongSet.size + '）</option>';
    el.chSel.innerHTML = opts;

    renderKnowledge();

    if (el.khTypeSel) el.khTypeSel.addEventListener("change", renderKnowledge);

    el.chSel.addEventListener("change", function(){
      var o = el.chSel.querySelector('option[value="__wrong__"]');
      if (o) o.textContent = "只刷错题本（" + wrongSet.size + "）";
    });

    el.startBtn.addEventListener("click", start);
    document.addEventListener("keydown", onKey);

    if (el.typeChk) el.typeChk.addEventListener("change", syncTypeChk);
    syncTypeChk();

    if (!restoreSession()) start();
  }

  function selectedTypes(){
    if (!el.typeChk) return ["single", "multiple", "short"];
    return Array.prototype.slice.call(el.typeChk.querySelectorAll("input:checked"))
      .map(function(i){ return i.value; });
  }

  function syncTypeChk(){
    if (!el.typeChk) return;
    el.typeChk.querySelectorAll("label.chk").forEach(function(l){
      var inp = l.querySelector("input");
      if (inp) l.classList.toggle("on", inp.checked);
    });
    var empty = selectedTypes().length === 0;
    el.startBtn.disabled = empty;
    el.startBtn.title = empty ? "至少勾选一种题型" : "";
    var hint = document.getElementById("typeHint");
    if (hint) hint.textContent = empty ? "请至少勾选一种题型" : "";
  }

  /* ---------- 知识点 ---------- */
  function renderKnowledge(){
    var filter = el.khTypeSel ? el.khTypeSel.value : "all";
    var html = "", count = 0;
    CHAPTERS.forEach(function(ch){
      var kh = ch.knowledge || {};
      var obj = (kh.objective || []).slice();
      var subj = (kh.subjective || []).slice();
      if (filter === "objective") subj = [];
      if (filter === "subjective") obj = [];
      if (!obj.length && !subj.length) return;
      count += obj.length + subj.length;

      html += '<div class="kh-card"><h3>' + escapeHtml(ch.name) + '</h3>';

      if (obj.length){
        html += '<div class="kh-sec"><div class="sec-tag obj">客观题考点</div>';
        obj.forEach(function(item){
          html += '<div class="kh-item"><b>' + escapeHtml(item.t) + '</b><p>' + escapeHtml(item.c) + '</p></div>';
        });
        html += '</div>';
      }

      if (subj.length){
        html += '<div class="kh-sec"><div class="sec-tag subj">主观题考点 · 简答/论述</div>';
        subj.forEach(function(item){
          html += '<div class="subj-item"><div class="subj-q">' + escapeHtml(item.q)
               + (item.page ? '<span class="pg">教材 ' + escapeHtml(item.page) + '</span>' : '')
               + '</div><ol>';
          (item.p || []).forEach(function(pt){ html += '<li>' + escapeHtml(pt) + '</li>'; });
          html += '</ol></div>';
        });
        html += '</div>';
      }

      html += '</div>';
    });

    if (el.khCount) el.khCount.textContent = count;
    el.khList.innerHTML = html || '<div class="kh-card"><p style="color:var(--sub);font-size:14px;margin:0">暂无内容</p></div>';
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  /* ---------- 开始 ---------- */
  function start(){
    var chVal = el.chSel.value;
    var types = selectedTypes();
    var order = el.orderSel.value;

    if (!types.length){
      el.qArea.innerHTML = '<div class="empty">请至少勾选一种题型再开始</div>';
      return;
    }

    var pool = [];
    if (chVal === "__wrong__"){
      var all = allQuestions();
      all.forEach(function(q){ if (wrongSet.has(q.id)) pool.push(q); });
    } else if (chVal === "all"){
      pool = allQuestions();
    } else {
      var ch = findChapter(chVal);
      if (ch) pool = ch.questions.slice();
    }

    if (types.length < 3){
      pool = pool.filter(function(q){ return types.indexOf(q.type) >= 0; });
    }

    if (order === "random"){
      for (var i = pool.length - 1; i > 0; i--){
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
      }
    }

    state.queue = pool;
    state.idx = 0;
    state.answered = 0;
    state.correct = 0;
    state.log = {};
    state.resumed = false;

    if (!pool.length){
      el.qArea.innerHTML = '<div class="done"><h2>没有可刷的题目</h2><p>换个筛选条件，或先去做几道题积累错题。</p></div>';
      updateStats();
      return;
    }
    renderQuestion();
    updateStats();
    saveSession(true);
  }

  /* ---------- 渲染 ---------- */
  function currentQ(){ return state.queue[state.idx]; }

  function updateStats(){
    el.stProgress.textContent = (state.idx + (state.queue.length && state.idx < state.queue.length ? 1 : 0)) + "/" + state.queue.length;
    el.stAnswered.textContent = state.answered;
    el.stCorrect.textContent = state.correct;
    el.stRate.textContent = state.answered ? Math.round(state.correct / state.answered * 100) + "%" : "—";
    el.stWrong.textContent = wrongSet.size;
    var pct = state.queue.length ? (state.idx / state.queue.length) * 100 : 0;
    el.bar.style.width = pct + "%";
  }

  function renderQuestion(){
    var q = currentQ();
    if (!q){ renderDone(); updateStats(); return; }

    var rec = state.log[q.id] || null;
    state.selected = rec ? (rec.selected || []).slice() : [];
    state.locked = !!rec;
    state.revealed = !!(rec && rec.revealed);

    var ch = findChapter(q.chapter);
    var chName = ch ? ch.name : q.chapter;
    var ansNorm = normalize(q.answer || "");

    var html = '';
    if (state.resumed){
      html += '<div class="resume-tip">已恢复上次进度 · 第 ' + (state.idx + 1) + ' / ' + state.queue.length +
              ' 题，已答 ' + state.answered + ' 题' +
              '<button class="btn" id="freshBtn">重新开始</button></div>';
      state.resumed = false;
    }
    html += '<div class="qcard">';
    html += '<div class="qmeta">';
    html += '<span class="badge type">' + QTYPE_LABEL[q.type] + '</span>';
    html += '<span class="badge ch">' + escapeHtml(chName) + '</span>';
    html += '<span class="badge idx">' + (state.idx + 1) + " / " + state.queue.length + '</span>';
    html += '</div>';
    html += '<div class="stem">' + escapeHtml(q.stem);
    if (q.type === "multiple" && !rec) html += '<span class="hint">多选题：选出所有正确选项后点击「提交答案」</span>';
    html += '</div>';

    if (q.type !== "short"){
      html += '<div class="opts" id="opts">';
      q.options.forEach(function(o){
        var cls = "opt";
        if (rec){
          cls += " locked";
          if (ansNorm.indexOf(o.key) >= 0) cls += " correct";
          else if (state.selected.indexOf(o.key) >= 0) cls += " wrong";
        } else if (state.selected.indexOf(o.key) >= 0){
          cls += " selected";
        }
        html += '<button class="' + cls + '" data-key="' + o.key + '">' +
                '<span class="k">' + o.key + '</span>' +
                '<span class="t">' + escapeHtml(o.text) + '</span></button>';
      });
      html += '</div>';
    }

    html += '<div class="actions">';
    if (rec){
      html += '<span class="kbdhint">按 Enter 进入下一题</span>';
    } else if (q.type === "short"){
      html += '<button class="btn primary" id="revealBtn">显示参考答案</button>';
    } else if (q.type === "multiple"){
      html += '<button class="btn primary" id="submitBtn" disabled>提交答案</button>';
    } else {
      html += '<span class="kbdhint">键盘 1–4 可快速选择</span>';
    }
    html += '<span class="spacer"></span>';
    if (!rec) html += '<button class="btn" id="skipBtn">跳过</button>';
    html += '</div>';
    html += '<div class="feedback" id="feedback"></div>';

    html += '<div class="qnav">';
    html += '<button class="btn navbtn" id="prevBtn"' + (state.idx > 0 ? '' : ' disabled') + '>← 上一题</button>';
    html += '<span class="navpos">第 ' + (state.idx + 1) + ' / ' + state.queue.length + ' 题</span>';
    html += '<button class="btn navbtn" id="navNextBtn"' + (state.locked ? '' : ' disabled') + '>下一题 →</button>';
    html += '</div>';

    html += '</div>';

    el.qArea.innerHTML = html;

    var optsEl = document.getElementById("opts");
    if (optsEl){
      optsEl.querySelectorAll(".opt").forEach(function(b){
        b.addEventListener("click", function(){ onPick(b.dataset.key); });
      });
    }

    var submitBtn = document.getElementById("submitBtn");
    if (submitBtn) submitBtn.addEventListener("click", function(){ judge(); });

    var revealBtn = document.getElementById("revealBtn");
    if (revealBtn) revealBtn.addEventListener("click", revealAnswer);

    var skipBtn = document.getElementById("skipBtn");
    if (skipBtn) skipBtn.addEventListener("click", next);

    var freshBtn = document.getElementById("freshBtn");
    if (freshBtn) freshBtn.addEventListener("click", function(){ clearSession(); start(); });

    document.getElementById("prevBtn").addEventListener("click", prev);
    document.getElementById("navNextBtn").addEventListener("click", next);

    if (rec) renderFeedback(q, rec);

    updateNav();
    updateStats();
  }

  function updateNav(){
    var p = document.getElementById("prevBtn");
    var n = document.getElementById("navNextBtn");
    if (p) p.disabled = state.idx <= 0;
    if (n) n.disabled = !state.locked;
  }

  function renderFeedback(q, rec){
    var fb = document.getElementById("feedback");
    if (!fb) return;
    if (q.type === "short" && rec.revealed){
      fb.className = "feedback show ok";
      fb.innerHTML = '<div class="fb-title">参考答案</div>' +
        '<div class="fb-body">' + escapeHtml(q.answer || "暂无参考答案") + '</div>' +
        analysisBlock(q, "答题思路");
      return;
    }
    var isCorrect = !!rec.correct;
    fb.className = "feedback show " + (isCorrect ? "ok" : "err");
    fb.innerHTML = '<div class="fb-title">' + (isCorrect ? "回答正确" : "回答错误") + '</div>' +
      '<div class="fb-ans">正确答案：<b>' + q.answer + '</b>' +
      (rec.selected && rec.selected.length ? '　你选择了：' + rec.selected.slice().sort().join("") : "") +
      '</div>' +
      analysisBlock(q, "解析");
  }

  function analysisBlock(q, lab){
    if (!q.analysis) return "";
    return '<div class="fb-analysis"><span class="fb-lab">' + (lab || "解析") + '</span>' + escapeHtml(q.analysis) + '</div>';
  }

  /* ---------- 作答 ---------- */
  function onPick(key){
    var q = currentQ();
    if (!q || state.locked || q.type === "short") return;

    if (q.type === "single"){
      state.selected = [key];
      paintOptions();
      judge();
      return;
    }

    // 多选 toggle
    var i = state.selected.indexOf(key);
    if (i >= 0) state.selected.splice(i, 1);
    else state.selected.push(key);
    paintOptions();

    var sb = document.getElementById("submitBtn");
    if (sb) sb.disabled = state.selected.length === 0;
  }

  function paintOptions(){
    var optsEl = document.getElementById("opts");
    if (!optsEl) return;
    optsEl.querySelectorAll(".opt").forEach(function(b){
      if (state.selected.indexOf(b.dataset.key) >= 0) b.classList.add("selected");
      else b.classList.remove("selected");
    });
  }

  function judge(){
    var q = currentQ();
    if (!q || state.locked || q.type === "short") return;
    if (!state.selected.length) return;

    state.locked = true;
    var picked = normalize(state.selected.join(""));
    var ans = normalize(q.answer || "");
    var isCorrect = picked === ans;

    // 高亮
    var optsEl = document.getElementById("opts");
    optsEl.querySelectorAll(".opt").forEach(function(b){
      var k = b.dataset.key;
      b.classList.add("locked");
      b.classList.remove("selected");
      if (ans.indexOf(k) >= 0) b.classList.add("correct");
      else if (state.selected.indexOf(k) >= 0) b.classList.add("wrong");
    });

    // 统计
    state.answered++;
    if (isCorrect){
      state.correct++;
      if (wrongSet.has(q.id)){ wrongSet.delete(q.id); saveWrong(); }
    } else {
      wrongSet.add(q.id);
      saveWrong();
    }

    // 记录作答，回看时还原
    var rec = {selected: state.selected.slice(), locked: true, correct: isCorrect};
    state.log[q.id] = rec;

    renderFeedback(q, rec);

    // 动作区替换
    var actions = document.querySelector(".actions");
    actions.innerHTML = '<span class="kbdhint">按 Enter 进入下一题</span><span class="spacer"></span>';

    updateNav();
    updateStats();
    saveSession(true);
  }

  function revealAnswer(){
    var q = currentQ();
    if (!q || state.revealed) return;
    state.revealed = true;
    state.locked = true;

    var rec = {selected: [], locked: true, revealed: true};
    state.log[q.id] = rec;

    renderFeedback(q, rec);

    var actions = document.querySelector(".actions");
    actions.innerHTML = '<span class="kbdhint">按 Enter 进入下一题</span><span class="spacer"></span>';

    updateNav();
    saveSession(true);
  }

  function prev(){
    if (state.idx <= 0) return;
    state.idx--;
    renderQuestion();
    updateStats();
    saveSession(true);
  }

  function next(){
    state.idx++;
    if (state.idx >= state.queue.length){ renderDone(); updateStats(); return; }
    renderQuestion();
    saveSession(true);
  }

  function renderDone(){
    var rate = state.answered ? Math.round(state.correct / state.answered * 100) : 0;
    el.qArea.innerHTML = '<div class="done">' +
      '<h2>本轮完成</h2>' +
      '<div class="score">' + rate + '%</div>' +
      '<p>共作答 ' + state.answered + ' 题，答对 ' + state.correct + ' 题</p>' +
      '<p>错题本累计 ' + wrongSet.size + ' 题，可在章节筛选里选择「只刷错题本」复习</p>' +
      '<div class="actions" style="justify-content:center;margin-top:22px">' +
      '<button class="btn primary" id="againBtn">重新开始</button></div></div>';
    document.getElementById("againBtn").addEventListener("click", start);
    el.bar.style.width = "100%";
    saveSession(true);
  }

  /* ---------- 键盘 ---------- */
  function onKey(e){
    if (document.getElementById("panel-practice").classList.contains("active") === false) return;
    var q = currentQ();
    if (!q) return;
    var key = e.key;

    if (key === "Enter" && state.locked){
      next();
      return;
    }
    if (key === "ArrowLeft"){
      prev();
      return;
    }
    if (!state.locked && q.type !== "short" && /^[1-4]$/.test(key)){
      var k = "ABCD"[parseInt(key, 10) - 1];
      if (q.options.some(function(o){ return o.key === k; })) onPick(k);
    }
  }

  loadData();
})();
</script>
</body>
</html>
